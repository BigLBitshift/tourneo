name: Build Applications

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run backend:build

      - name: Test backend
        run: npm run backend:test

      - name: Upload backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: apps/backend/dist
          if-no-files-found: error

  mobile:
    name: Expo Mobile App
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile app
        run: npm run mobile:typecheck

      - name: Test mobile app
        run: npm run mobile:test

      - name: Build Expo bundles
        run: npm run mobile:build

      - name: Upload Expo export
        uses: actions/upload-artifact@v7
        with:
          name: mobile-expo-export
          path: apps/mobile/dist
          if-no-files-found: error

  admin-dashboard:
    name: Admin Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check static dashboard
        run: npm run admin:check

      - name: Upload static dashboard
        uses: actions/upload-artifact@v7
        with:
          name: admin-dashboard
          path: apps/admin-dashboard
          if-no-files-found: error

  docker:
    name: API Image
    runs-on: ubuntu-latest
    # Only meaningful once the code compiles and the tests pass.
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the production image on every PR so a broken Dockerfile is
      # caught here rather than during a deploy. Pushing to a registry is
      # deliberately not wired up yet — that needs a registry, credentials
      # and a deploy target, all of which are owner decisions.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: true
          tags: tourneo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          # The container must start, serve liveness, and exit on SIGTERM.
          # No database is available here, which is exactly why /health is
          # dependency-free and /ready is not.
          #
          # validateEnv() fail-fasts in production on missing config, so
          # every variable it demands must be present or the process exits
          # before it ever listens. These are throwaway placeholders — just
          # enough for the container to boot and prove the image works.
          # No Stripe keys: with PAYMENTS_ENABLED unset they are not
          # required, and stuffing fake ones in is how a test key ends up
          # in a production deploy later.
          docker run -d --name tourneo-api-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e JWT_ACCESS_SECRET=smoke-test-access-secret-at-least-32-chars \
            -e JWT_REFRESH_SECRET=smoke-test-refresh-secret-at-least-32-ch \
            -e APP_URL=https://smoke.invalid \
            -e ADMIN_URL=https://admin.smoke.invalid \
            -e DB_PASSWORD=smoke \
            tourneo-api:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then
              echo "✅ liveness responded"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ container never became live"
              docker logs tourneo-api-smoke
              exit 1
            fi
            sleep 2
          done

          # Graceful shutdown must actually exit on SIGTERM. Without tini
          # as PID 1 Node never receives it, docker falls back to SIGKILL
          # after the timeout, and every in-flight request dies with it —
          # so a slow stop here is a real regression, not noise.
          start=$(date +%s)
          docker stop --time 20 tourneo-api-smoke
          elapsed=$(( $(date +%s) - start ))
          echo "shutdown took ${elapsed}s"
          docker logs tourneo-api-smoke | tail -20

          if [ "$elapsed" -ge 20 ]; then
            echo "❌ container had to be killed — SIGTERM was not handled"
            exit 1
          fi
          echo "✅ graceful shutdown in ${elapsed}s"
